data:
  hf_root: data/vcm/raw
  protocol: data/vcm/protocols/hf_aligned_v1/protocol.json
  manifests: data/vcm/protocols/hf_aligned_v1/manifests
  feature_cache: data/vcm/processed/hf_aligned_v1
audio:
  sample_rate: 16000
  n_fft: 400
  hop_length: 160
  n_mels: 80
  window_seconds: 2.0
  f_min: 20.0
  f_max: 8000.0
schema:
  n_way_head: 20
  oos_class: OUT_OF_SCOPE
  slot_reject: false
  slotted_intents: [TIMER, ALARM, TEMPERATURE, BRIGHTNESS, COLOR, CREATE_REMINDER]
  slot_sets:
    TIMER: [10s, 30s, 1m]
    ALARM: [6AM, 8AM, 9PM]
    TEMPERATURE: ["18", "22", "26"]
    BRIGHTNESS: ["20", "60", "100"]
    COLOR: [red, blue, green]
    CREATE_REMINDER: [drink_water, study, exercise]
training:
  arch: a10
  seed: 42
  epochs: 30
  batch_size: 256
  lr: 0.003
  optimizer: adamw
  weight_decay: 0.01
  warmup_epochs: 2
  early_stop_patience: 8
  device: cuda
  num_workers: 4
  augment_mode: spec_aug
  label_smoothing: 0.05
  enable_slot_heads: true
  slot_loss_weight: 0.5
oos:
  strategy: learned_plus_confidence_gate
  confidence_threshold: 0.5
