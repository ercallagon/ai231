# configs/vcm_e2_a2_tcregnet.yaml — run_008: A2 TC-ResNet on E2 enriched data.
#
# Architecture sweep candidate #2 (campaign §14). Tests whether the residual
# temporal-conv family outperforms DS-CNN on the enriched dataset.
# Optimization hyperparams match run_006 (AdamW, warmup, spec-aug, LS) so the
# ONLY variable vs run_006 is the architecture.
#
# A2 TC-ResNet w32: ~75,540 params (small, fast, Pi-friendly).

data:
  hf_root: data/vcm/raw
  manifests: data/vcm/manifests
  splits: data/vcm/manifests/splits.json
  frozen_test: data/vcm/manifests/test_19intent_frozen.csv
  holdout: data/vcm/manifests/holdout_untouched.csv

audio:
  sample_rate: 16000
  mono: true
  n_fft: 400
  hop_length: 160
  n_mels: 80
  window_seconds: 2.0
  f_min: 20.0
  f_max: 8000.0
  center_crop_pad: true

schema:
  n_intents: 19
  oos_class: OUT_OF_SCOPE
  n_way_head: 20
  slotted_intents: [TIMER, ALARM, TEMPERATURE, BRIGHTNESS, COLOR, CREATE_REMINDER]
  slot_reject: false
  slot_sets:
    TIMER: [10s, 30s, 1m, REJECT]
    ALARM: [6AM, 8AM, 9PM, REJECT]
    TEMPERATURE: [18, 22, 26, REJECT]
    BRIGHTNESS: [20, 60, 100, REJECT]
    COLOR: [red, blue, green, REJECT]
    CREATE_REMINDER: [drink_water, study, exercise, REJECT]

oos:
  confidence_threshold: 0.5
  strategy: learned_plus_confidence_gate

training:
  arch: a2
  batch_size: 256
  epochs: 30
  lr: 0.003
  optimizer: adamw
  weight_decay: 0.01
  warmup_epochs: 2
  early_stop_patience: 8
  seed: 42
  device: cuda
  gpu_index: 1
  augment_mode: spec_aug
  label_smoothing: 0.05
  num_workers: 8
  checkpoint: best.pt
