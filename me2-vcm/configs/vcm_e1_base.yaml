# configs/vcm_e1_base.yaml — Campaign E1: BASE training data only.
#
# Derived from the LOCKED configs/vcm.yaml (identical schema/audio/training
# blocks). The ONLY difference is the train population:
#   data.manifests.train -> data/vcm/manifests/base/train_base_19intent.csv
#     (9,562 rows = HF 'data' subset only; excludes supplemental_synth,
#      supplemental_fil, synthetic_negatives/train)
# val/test/holdout are the SAME frozen manifests as the full campaign, so
# E1 vs E2 is a controlled comparison (same arch, seed, preprocessing,
# optimization, validation procedure — per vcm_campaign.md §18).
#
# NOTE: intentionally does NOT set training.max_train_rows — the earlier
# 50-row smoke cap was a smoke-test-only setting and must not leak into the
# definitive run.

data:
  hf_root: data/vcm/raw
  manifests: data/vcm/manifests
  splits: data/vcm/manifests/splits.json
  frozen_test: data/vcm/manifests/test_19intent_frozen.csv
  holdout: data/vcm/manifests/holdout_untouched.csv
  manifests_override:
    train: data/vcm/manifests/base/train_base_19intent.csv

audio:
  sample_rate: 16000
  mono: true
  n_fft: 400
  hop_length: 160
  n_mels: 80
  window_seconds: 2.0
  f_min: 20.0
  f_max: 8000.0
  center_crop_pad: true

schema:
  n_intents: 19
  oos_class: OUT_OF_SCOPE
  n_way_head: 20
  slotted_intents: [TIMER, ALARM, TEMPERATURE, BRIGHTNESS, COLOR, CREATE_REMINDER]
  slot_reject: false
  slot_sets:
    TIMER: [10s, 30s, 1m, REJECT]
    ALARM: [6AM, 8AM, 9PM, REJECT]
    TEMPERATURE: [18, 22, 26, REJECT]
    BRIGHTNESS: [20, 60, 100, REJECT]
    COLOR: [red, blue, green, REJECT]
    CREATE_REMINDER: [drink_water, study, exercise, REJECT]

oos:
  confidence_threshold: 0.5
  strategy: learned_plus_confidence_gate

training:
  arch: a0
  batch_size: 32
  epochs: 40
  lr: 0.001
  optimizer: adam
  early_stop_patience: 8
  seed: 42
  device: cuda
  gpu_index: 7
  augment: true
  num_workers: 8
  checkpoint: best.pt
