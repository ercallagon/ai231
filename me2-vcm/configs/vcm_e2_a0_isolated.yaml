# configs/vcm_e2_a0_isolated.yaml — run_007: isolate the DATA effect.
#
# Identical to run_005 (baseline) in EVERY way EXCEPT the training data:
#   - Same arch: A0 DS-CNN [32,64,128,256] (393,940 params)
#   - Same optimizer: Adam (no weight decay)
#   - Same LR: 0.004, cosine schedule, no warmup
#   - Same batch: 256
#   - Same augmentation: NONE
#   - Same label smoothing: 0
#   - Same seed: 42
#   - DIFFERENT data: E2 FULL-ENRICHED (30,487 clips) vs E1 BASE (9,562 clips)
#
# This answers: "is the run_006 gain from enrichment or from the bigger model?"
# Per vcm_campaign.md §18: controlled comparison, same arch/seed/preprocessing.

data:
  hf_root: data/vcm/raw
  manifests: data/vcm/manifests
  splits: data/vcm/manifests/splits.json
  frozen_test: data/vcm/manifests/test_19intent_frozen.csv
  holdout: data/vcm/manifests/holdout_untouched.csv
  # NO manifests_override → uses full train_19intent.csv (30,487 clips)

audio:
  sample_rate: 16000
  mono: true
  n_fft: 400
  hop_length: 160
  n_mels: 80
  window_seconds: 2.0
  f_min: 20.0
  f_max: 8000.0
  center_crop_pad: true

schema:
  n_intents: 19
  oos_class: OUT_OF_SCOPE
  n_way_head: 20
  slotted_intents: [TIMER, ALARM, TEMPERATURE, BRIGHTNESS, COLOR, CREATE_REMINDER]
  slot_reject: false
  slot_sets:
    TIMER: [10s, 30s, 1m, REJECT]
    ALARM: [6AM, 8AM, 9PM, REJECT]
    TEMPERATURE: [18, 22, 26, REJECT]
    BRIGHTNESS: [20, 60, 100, REJECT]
    COLOR: [red, blue, green, REJECT]
    CREATE_REMINDER: [drink_water, study, exercise, REJECT]

oos:
  confidence_threshold: 0.5
  strategy: learned_plus_confidence_gate

training:
  arch: a0
  batch_size: 256
  epochs: 30
  lr: 0.004
  optimizer: adam
  weight_decay: 0.0
  warmup_epochs: 0
  early_stop_patience: 8
  seed: 42
  device: cuda
  gpu_index: 1
  augment_mode: none
  label_smoothing: 0.0
  num_workers: 8
  checkpoint: best.pt
