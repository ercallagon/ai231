# run_019 — staged slot-head training on the run_016 wide TC-ResNet champion.
# Freezes the validated intent/OOS model and trains only closed-set slot heads.
data:
  hf_root: data/vcm/raw
  manifests: data/vcm/manifests
  splits: data/vcm/manifests/splits.json
  frozen_test: data/vcm/manifests/test_19intent_frozen.csv
  holdout: data/vcm/manifests/holdout_untouched.csv
audio:
  sample_rate: 16000
  mono: true
  n_fft: 400
  hop_length: 160
  n_mels: 80
  window_seconds: 2.0
  f_min: 20.0
  f_max: 8000.0
  center_crop_pad: true
schema:
  n_intents: 19
  oos_class: OUT_OF_SCOPE
  n_way_head: 20
  slotted_intents: [TIMER, ALARM, TEMPERATURE, BRIGHTNESS, COLOR, CREATE_REMINDER]
  slot_reject: false
  slot_sets:
    TIMER: [10s, 30s, 1m, REJECT]
    ALARM: [6AM, 8AM, 9PM, REJECT]
    TEMPERATURE: [18, 22, 26, REJECT]
    BRIGHTNESS: [20, 60, 100, REJECT]
    COLOR: [red, blue, green, REJECT]
    CREATE_REMINDER: [drink_water, study, exercise, REJECT]
training:
  seed: 42
  epochs: 15
  batch_size: 256
  lr: 0.003
  optimizer: adamw
  weight_decay: 0.01
  warmup_epochs: 1
  early_stop_patience: 5
  device: cuda
  checkpoint: best.pt
  num_workers: 8
  augment_mode: spec_aug
  label_smoothing: 0.0
  arch: a2w
  enable_slot_heads: true
  init_from: experiments/vcm/run_016_e2_a2_wide/best.pt
  freeze_backbone: true
  freeze_intent_head: true
  intent_loss_weight: 0.0
  slot_loss_weight: 1.0
oos:
  strategy: learned_plus_confidence_gate
  confidence_threshold: 0.5
