[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hey-swift"
version = "0.1.0"
description = "Hey Swift wake-word + 19-intent Voice Command Model (VCM) for Raspberry Pi 5 (CPU-only, reproducible, open-source)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Edgardo Callagon Jr." }]
keywords = ["wake-word", "keyword-spotting", "speech", "intent", "slot-filling",
            "on-device", "raspberry-pi", "onnx"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Runtime deps are intentionally light so `import hey_swift` works on a laptop
# with no GPU and no Pi libs. Heavy/optional deps (torch, sounddevice, gpiozero)
# are declared as extras and imported lazily by the modules that need them.
dependencies = [
    "numpy>=2.2,<2.6",
    "scipy>=1.15,<1.19",
    "onnxruntime>=1.22,<1.31",
    "soundfile>=0.13,<0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training stack (NOT needed for inference/deploy on the Pi).
train = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "pandas>=2.1",
    "onnx>=1.16",
    "scikit-learn>=1.4",
]
data = ["pandas>=2.1", "pyarrow>=15", "huggingface_hub>=0.23"]
cli = ["typer>=0.12", "rich>=13.0"]
# Live microphone capture / playback (portaudio-backed).
audio = [
    "sounddevice>=0.4",
]
# Raspberry Pi hardware peripherals.
pi = [
    "gpiozero>=2.0",
    "dbus-next>=0.2.3",
]
speech = ["piper-tts>=1.2"]
# Dev / test tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
all = ["hey-swift[train,data,cli,audio,pi,speech,dev]"]

[project.scripts]
hey-swift = "hey_swift.cli:app"

[project.urls]
Homepage = "https://github.com/ercallagon/ai231/tree/main/me2-vcm"
Repository = "https://github.com/ercallagon/ai231"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hey_swift = ["py.typed"]

# --- Tooling ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
